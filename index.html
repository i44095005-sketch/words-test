<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>短文穴埋め 4択問題集</title>
  <!-- Excel読み書き用ライブラリ (SheetJS) -->
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 600px;
      margin: 0 auto;
      padding: 16px;
      background-color: #f4f7f6;
      color: #333;
      line-height: 1.6;
    }
    .card {
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      margin-bottom: 16px;
    }
    h1 { font-size: 1.35rem; text-align: center; margin-top: 0; }
    input[type="file"] { width: 100%; margin: 10px 0; }
    .setting-group {
      margin: 14px 0;
      padding: 12px;
      background: #f8f9fa;
      border-radius: 8px;
    }
    .setting-group label {
      display: block;
      font-size: 0.9rem;
      font-weight: bold;
      margin-bottom: 6px;
    }
    .range-inputs {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    input[type="number"], select {
      padding: 8px 10px;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: #fff;
    }
    input[type="number"] { width: 85px; text-align: center; }
    select { width: 100%; }

    /* 習得度サマリーバー */
    .mastery-summary {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
      margin: 12px 0;
      text-align: center;
    }
    .mastery-stat {
      padding: 6px 2px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: bold;
    }
    .mastery-stat span {
      display: block;
      font-size: 1rem;
      margin-top: 2px;
    }

    /* 習得度バッジ配色 */
    .lv-0 { background: #eef1f5; color: #555; }       /* 未学習 */
    .lv-1 { background: #fdecea; color: #c0392b; }    /* 苦手 */
    .lv-2 { background: #fef5e7; color: #d35400; }    /* うろ覚え */
    .lv-3 { background: #e8f8f5; color: #16a085; }    /* ほぼ覚え */
    .lv-4 { background: #eafaf1; color: #27ae60; }    /* 完璧 */

    .mastery-pill {
      padding: 2px 9px;
      border-radius: 12px;
      font-size: 0.78rem;
      font-weight: bold;
    }

    .meta-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: #666;
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid #eee;
      gap: 6px;
      flex-wrap: wrap;
    }
    .meta-tags {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .category-tag {
      background: #e8f4fd;
      color: #2980b9;
      padding: 2px 10px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 0.8rem;
    }

    /* タイマーバー */
    .timer-wrapper { margin-bottom: 14px; }
    .timer-label-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: #7f8c8d;
      margin-bottom: 4px;
      font-variant-numeric: tabular-nums;
    }
    .timer-label-row.warning { color: #e74c3c; font-weight: bold; }
    .timer-track {
      width: 100%;
      height: 8px;
      background-color: #e9ecef;
      border-radius: 999px;
      overflow: hidden;
    }
    .timer-fill {
      height: 100%;
      width: 100%;
      background-color: #3498db;
      border-radius: 999px;
      transition: width 0.1s linear, background-color 0.3s ease;
    }
    .timer-fill.half { background-color: #f39c12; }
    .timer-fill.danger { background-color: #e74c3c; }

    .question-box {
      font-size: 1.15rem;
      font-weight: 600;
      color: #2c3e50;
      margin: 12px 0 20px;
      padding: 14px;
      background: #fcfdfd;
      border-left: 4px solid #3498db;
      border-radius: 4px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 13px 16px;
      margin: 10px 0;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background-color: #3498db;
      color: white;
      transition: background 0.15s;
    }
    .btn:active { background-color: #2980b9; }
    .btn-export { background-color: #27ae60; }
    .btn-export:active { background-color: #219150; }
    .choice-btn {
      background-color: #f1f3f5;
      color: #2c3e50;
      text-align: left;
      font-weight: normal;
      display: flex;
      align-items: baseline;
      gap: 10px;
    }
    .choice-label { font-weight: bold; min-width: 24px; color: #3498db; }
    .choice-btn.correct { background-color: #2ecc71; color: white; }
    .choice-btn.correct .choice-label { color: white; }
    .choice-btn.wrong { background-color: #e74c3c; color: white; }
    .choice-btn.wrong .choice-label { color: white; }

    .explanation-box {
      margin-top: 20px;
      padding: 16px;
      background: #fff9e6;
      border: 1px solid #ffeaa7;
      border-radius: 8px;
      font-size: 0.95rem;
    }
    .explanation-box h3 { margin: 0 0 6px; font-size: 0.95rem; }
    .level-change-note {
      display: inline-block;
      margin-bottom: 10px;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: bold;
      background: #fff;
      border: 1px solid #e0d3a6;
    }
    .translation-text {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px dashed #e0d3a6;
      color: #444;
    }
    .status { text-align: center; font-size: 0.9rem; color: #7f8c8d; margin: 4px 0; }
    .file-badge {
      display: inline-block;
      background: #e8f4fd;
      color: #2980b9;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: bold;
      margin-bottom: 6px;
    }
    .score-display {
      font-size: 2rem;
      font-weight: bold;
      text-align: center;
      margin: 20px 0;
      color: #2c3e50;
    }
    .hidden { display: none; }
  </style>
</head>
<body>

  <!-- 1. ファイル選択画面 -->
  <div class="card" id="setup-area">
    <h1>短文穴埋め 4択問題集</h1>
    <p style="font-size: 0.9rem;">スマホ内のExcelファイル（.xlsx / .xlsm / .xls）を選択してください。</p>
    <p style="font-size: 0.8rem; color: #666; background: #f8f9fa; padding: 10px; border-radius: 6px;">
      <strong>列構成：</strong><br>
      A:番号 / B:分野 / C:問題文 / D〜G:選択肢A〜D / H:解答 / I:解説 / J:日本語訳<br>
      ※K列に「習得度」があれば自動で引き継ぎます。
    </p>
    <input type="file" id="excel-file">

    <div id="sheet-select-area" class="setting-group hidden">
      <label>読み込むシートを選択してください</label>
      <select id="sheet-select"></select>
      <button class="btn" onclick="loadSelectedSheet()">このシートを読み込む</button>
    </div>
  </div>

  <!-- 2. 出題設定画面 -->
  <div class="card hidden" id="config-area">
    <h1>出題設定</h1>
    <div style="text-align: center;">
      <span class="file-badge" id="saved-filename">保存済みデータ</span>
      <p class="status" id="total-words-info">全 0 問</p>
    </div>

    <!-- 習得度内訳 -->
    <div class="mastery-summary" id="mastery-summary"></div>

    <div class="setting-group">
      <label>習得度で絞り込む</label>
      <select id="mastery-filter" onchange="updateAvailableCount()">
        <option value="ALL">すべて</option>
        <option value="NOT_PERFECT">「完璧」以外すべて（未学習〜ほぼ覚え）</option>
        <option value="WEAK_AND_NEW">未学習 ＋ 苦手 のみ</option>
        <option value="0">未学習 のみ</option>
        <option value="1">苦手 のみ</option>
        <option value="2">うろ覚え のみ</option>
        <option value="3">ほぼ覚え のみ</option>
        <option value="4">完璧 のみ</option>
      </select>
    </div>

    <div class="setting-group">
      <label>分野で絞り込む</label>
      <select id="category-select" onchange="updateAvailableCount()">
        <option value="ALL">すべての分野</option>
      </select>
    </div>

    <div class="setting-group">
      <label>出題範囲（A列の番号 / 行順）</label>
      <div class="range-inputs">
        <input type="number" id="start-num" min="1" value="1" onchange="updateAvailableCount()"> 〜
        <input type="number" id="end-num" min="1" value="10" onchange="updateAvailableCount()">
      </div>
      <div style="font-size: 0.85rem; font-weight: bold; color: #2980b9; margin-top: 8px;" id="matched-count-info">
        条件に一致する問題: 0 問
      </div>
    </div>

    <div class="setting-group">
      <label>出題数</label>
      <div class="range-inputs">
        <input type="number" id="question-count" min="1" value="10"> 問
        <label style="font-weight: normal; margin: 0 0 0 10px; display: flex; align-items: center; gap: 4px;">
          <input type="checkbox" id="shuffle-check" checked> ランダム順
        </label>
      </div>
    </div>

    <div class="setting-group">
      <label>制限時間（1問あたり・時間切れ後も解答可）</label>
      <select id="timer-select">
        <option value="0">なし（タイマー非表示）</option>
        <option value="15">15秒</option>
        <option value="20">20秒</option>
        <option value="30" selected>30秒</option>
        <option value="45">45秒</option>
        <option value="60">60秒</option>
      </select>
    </div>

    <button class="btn" onclick="startQuiz()">テスト開始</button>
    <button class="btn btn-export" onclick="exportToExcel()">📥 習得度をExcelに書き出して保存</button>
    <button class="btn" style="background-color: #95a5a6;" onclick="resetData()">別のファイル・シートを選ぶ</button>
  </div>

  <!-- 3. クイズ画面 -->
  <div class="card hidden" id="quiz-area">
    <div class="meta-bar">
      <span id="progress-text">問題 1 / 10 (No.1)</span>
      <div class="meta-tags">
        <span class="mastery-pill lv-0" id="question-mastery">未学習</span>
        <span class="category-tag" id="question-category">品詞</span>
      </div>
    </div>

    <div class="timer-wrapper" id="timer-wrapper">
      <div class="timer-label-row" id="timer-label-row">
        <span>残り時間</span>
        <span id="timer-text">30秒</span>
      </div>
      <div class="timer-track">
        <div class="timer-fill" id="timer-bar"></div>
      </div>
    </div>

    <div class="question-box" id="question-sentence">Question text here...</div>

    <div id="choices-container"></div>

    <div class="explanation-box hidden" id="explanation-area">
      <h3 id="result-banner">⭕ 正解！</h3>
      <div class="level-change-note" id="level-change-text">習得度: 未学習 → うろ覚え</div>
      <div id="explanation-text"></div>
      <div class="translation-text" id="translation-text"></div>
    </div>

    <button class="btn hidden" id="next-btn" onclick="nextQuestion()">次の問題へ</button>
  </div>

  <!-- 4. 結果画面 -->
  <div class="card hidden" id="result-area">
    <h1>テスト終了！</h1>
    <p class="score-display" id="score-text">8 / 10 問正解</p>
    <button class="btn" onclick="startQuiz()">同じ条件で続ける</button>
    <button class="btn" style="background-color: #2980b9;" onclick="backToConfig()">設定画面に戻る</button>
    <button class="btn btn-export" onclick="exportToExcel()">📥 習得度をExcelに書き出して保存</button>
  </div>

<script>
  const STORAGE_KEY_QUESTIONS = 'fill_blank_quiz_data_v3';
  const STORAGE_KEY_META = 'fill_blank_quiz_meta_v3';

  // 習得度レベル定義（0〜4）
  const MASTERY_LABELS = ['未学習', '苦手', 'うろ覚え', 'ほぼ覚え', '完璧'];

  let currentWorkbook = null;
  let currentFileName = '';
  let questionList = [];
  let currentIndex = 0;
  let score = 0;
  let quizQuestions = [];

  let timerInterval = null;
  let timerLimitSeconds = 30;
  let timerStartTime = 0;

  window.addEventListener('DOMContentLoaded', () => {
    const savedData = localStorage.getItem(STORAGE_KEY_QUESTIONS);
    const savedMeta = localStorage.getItem(STORAGE_KEY_META);

    if (savedData) {
      try {
        questionList = JSON.parse(savedData);
        const meta = savedMeta ? JSON.parse(savedMeta) : {};
        if (questionList.length >= 1) {
          setupConfigScreen(meta.displayTitle || '保存済みファイル', meta);
        }
      } catch (e) {
        console.error('保存データの読み込みに失敗しました', e);
      }
    }
  });

  function saveQuestionsToLocal() {
    try {
      localStorage.setItem(STORAGE_KEY_QUESTIONS, JSON.stringify(questionList));
    } catch (e) {
      console.error('localStorageへの保存に失敗しました', e);
    }
  }

  document.getElementById('excel-file').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;

    currentFileName = file.name;
    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const data = new Uint8Array(e.target.result);
        currentWorkbook = XLSX.read(data, { type: 'array' });
      } catch (err) {
        alert("Excelファイルの解析に失敗しました。ファイル形式を確認してください。");
        return;
      }

      const sheetNames = currentWorkbook.SheetNames;
      if (!sheetNames || sheetNames.length === 0) {
        alert("シートが見つかりません。");
        return;
      }

      const sheetSelect = document.getElementById('sheet-select');
      sheetSelect.innerHTML = '';
      let autoDetectedIndex = -1;

      sheetNames.forEach((name, idx) => {
        const parsed = parseSheet(currentWorkbook.Sheets[name]);
        const opt = document.createElement('option');
        opt.value = name;
        opt.textContent = `${name}（有効問題: ${parsed.length}問）`;
        sheetSelect.appendChild(opt);

        if (autoDetectedIndex === -1 && parsed.length > 0) {
          autoDetectedIndex = idx;
        }
      });

      if (sheetNames.length === 1 && autoDetectedIndex === 0) {
        sheetSelect.selectedIndex = 0;
        loadSelectedSheet();
        return;
      }

      if (autoDetectedIndex !== -1) {
        sheetSelect.selectedIndex = autoDetectedIndex;
      }
      document.getElementById('sheet-select-area').classList.remove('hidden');
    };
    reader.readAsArrayBuffer(file);
  });

  function toHalfWidth(str) {
    return str.replace(/[Ａ-Ｚａ-ｚ０-９]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0));
  }

  // K列の文字列から習得度レベル(0〜4)を判定
  function parseMasteryLevel(val) {
    const str = String(val || '').trim();
    const idx = MASTERY_LABELS.indexOf(str);
    return idx !== -1 ? idx : 0; // 未指定なら0(未学習)
  }

  function parseSheet(sheet) {
    const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
    const parsed = [];

    rows.forEach((row) => {
      const sentence = String(row[2] || '').trim();
      let rawAns = toHalfWidth(String(row[7] || '')).trim().toUpperCase();
      rawAns = rawAns.replace(/[^A-D]/g, '');

      if (!sentence || !['A', 'B', 'C', 'D'].includes(rawAns)) return;

      const choiceA = String(row[3] || '').trim();
      const choiceB = String(row[4] || '').trim();
      if (!choiceA && !choiceB) return;

      const numVal = parseInt(toHalfWidth(String(row[0] || '')), 10);
      const qNum = !isNaN(numVal) ? numVal : (parsed.length + 1);

      parsed.push({
        num: qNum,
        category: String(row[1] || '').trim() || '未分類',
        question: sentence,
        choices: {
          A: choiceA,
          B: choiceB,
          C: String(row[5] || '').trim(),
          D: String(row[6] || '').trim()
        },
        answer: rawAns,
        explanation: String(row[8] || '').trim() || '',
        translation: String(row[9] || '').trim() || '',
        mastery: parseMasteryLevel(row[10]),     // K列: 習得度 (0〜4)
        lastAnswered: String(row[11] || '').trim() // L列: 最終解答日時
      });
    });

    return parsed;
  }

  function loadSelectedSheet() {
    if (!currentWorkbook) return;
    const sheetName = document.getElementById('sheet-select').value;
    const sheet = currentWorkbook.Sheets[sheetName];
    const parsed = parseSheet(sheet);

    if (parsed.length === 0) {
      alert(`シート「${sheetName}」から有効な問題が見つかりませんでした。`);
      return;
    }

    questionList = parsed;
    const displayTitle = `${currentFileName} [${sheetName}]`;
    const baseFileName = currentFileName.replace(/\.[^/.]+$/, '');

    const minNum = Math.min(...questionList.map(q => q.num));
    const maxNum = Math.max(...questionList.map(q => q.num));
    const defaultMeta = {
      displayTitle: displayTitle,
      baseFileName: baseFileName,
      sheetName: sheetName,
      masteryFilter: 'ALL',
      category: 'ALL',
      startNum: minNum,
      endNum: maxNum,
      count: Math.min(10, questionList.length),
      shuffle: true,
      timerSeconds: 30
    };

    saveQuestionsToLocal();
    try {
      localStorage.setItem(STORAGE_KEY_META, JSON.stringify(defaultMeta));
    } catch (err) {}

    setupConfigScreen(displayTitle, defaultMeta);
  }

  // 習得度ごとの問題数を集計してバッジ表示
  function renderMasterySummary() {
    const counts = [0, 0, 0, 0, 0];
    questionList.forEach(q => {
      const lv = q.mastery || 0;
      if (counts[lv] !== undefined) counts[lv]++;
    });

    const container = document.getElementById('mastery-summary');
    container.innerHTML = '';
    MASTERY_LABELS.forEach((label, idx) => {
      const div = document.createElement('div');
      div.className = `mastery-stat lv-${idx}`;
      div.innerHTML = `${label}<span>${counts[idx]}</span>`;
      container.appendChild(div);
    });
  }

  function setupConfigScreen(displayTitle, meta = {}) {
    document.getElementById('saved-filename').textContent = `📄 ${displayTitle}`;
    document.getElementById('total-words-info').textContent = `全 ${questionList.length} 問（自動保存中）`;

    renderMasterySummary();

    const categories = [...new Set(questionList.map(q => q.category))];
    const catSelect = document.getElementById('category-select');
    catSelect.innerHTML = '<option value="ALL">すべての分野</option>';
    categories.forEach(cat => {
      const opt = document.createElement('option');
      opt.value = cat;
      opt.textContent = cat;
      catSelect.appendChild(opt);
    });
    if (meta.category && (meta.category === 'ALL' || categories.includes(meta.category))) {
      catSelect.value = meta.category;
    }

    if (meta.masteryFilter) {
      document.getElementById('mastery-filter').value = meta.masteryFilter;
    }

    const minNum = Math.min(...questionList.map(q => q.num));
    const maxNum = Math.max(...questionList.map(q => q.num));

    document.getElementById('start-num').value = meta.startNum || minNum;
    document.getElementById('end-num').value = meta.endNum || maxNum;
    document.getElementById('question-count').value = meta.count || Math.min(10, questionList.length);
    document.getElementById('shuffle-check').checked = meta.shuffle !== undefined ? meta.shuffle : true;
    document.getElementById('timer-select').value = meta.timerSeconds !== undefined ? String(meta.timerSeconds) : '30';

    updateAvailableCount();

    document.getElementById('setup-area').classList.add('hidden');
    document.getElementById('config-area').classList.remove('hidden');
  }

  function getFilteredQuestions() {
    const masteryFilter = document.getElementById('mastery-filter').value;
    const selectedCat = document.getElementById('category-select').value;
    const startNum = parseInt(document.getElementById('start-num').value, 10) || 0;
    const endNum = parseInt(document.getElementById('end-num').value, 10) || 999999;

    return questionList.filter(q => {
      const lv = q.mastery || 0;
      let matchMastery = true;
      if (masteryFilter === 'NOT_PERFECT') {
        matchMastery = lv < 4;
      } else if (masteryFilter === 'WEAK_AND_NEW') {
        matchMastery = (lv === 0 || lv === 1);
      } else if (masteryFilter !== 'ALL') {
        matchMastery = (lv === parseInt(masteryFilter, 10));
      }

      const matchCat = (selectedCat === 'ALL' || q.category === selectedCat);
      const matchNum = (q.num >= startNum && q.num <= endNum);
      return matchMastery && matchCat && matchNum;
    });
  }

  function updateAvailableCount() {
    const filtered = getFilteredQuestions();
    document.getElementById('matched-count-info').textContent = `条件に一致する問題: ${filtered.length} 問`;
  }

  function resetData() {
    stopTimer();
    document.getElementById('excel-file').value = '';
    document.getElementById('sheet-select-area').classList.add('hidden');
    document.getElementById('config-area').classList.add('hidden');
    document.getElementById('result-area').classList.add('hidden');
    document.getElementById('setup-area').classList.remove('hidden');
  }

  function startQuiz() {
    const filtered = getFilteredQuestions();
    if (filtered.length === 0) {
      alert("指定された条件に該当する問題がありません。");
      return;
    }

    const count = parseInt(document.getElementById('question-count').value, 10);
    if (isNaN(count) || count < 1) {
      alert("出題数は1以上を指定してください。");
      return;
    }

    const isShuffle = document.getElementById('shuffle-check').checked;
    timerLimitSeconds = parseInt(document.getElementById('timer-select').value, 10) || 0;

    try {
      const currentMeta = JSON.parse(localStorage.getItem(STORAGE_KEY_META) || '{}');
      currentMeta.masteryFilter = document.getElementById('mastery-filter').value;
      currentMeta.category = document.getElementById('category-select').value;
      currentMeta.startNum = parseInt(document.getElementById('start-num').value, 10);
      currentMeta.endNum = parseInt(document.getElementById('end-num').value, 10);
      currentMeta.count = count;
      currentMeta.shuffle = isShuffle;
      currentMeta.timerSeconds = timerLimitSeconds;
      localStorage.setItem(STORAGE_KEY_META, JSON.stringify(currentMeta));
    } catch (e) {}

    let pool = [...filtered];
    if (isShuffle) {
      pool.sort(() => Math.random() - 0.5);
    }
    quizQuestions = pool.slice(0, Math.min(count, pool.length));

    currentIndex = 0;
    score = 0;
    document.getElementById('config-area').classList.add('hidden');
    document.getElementById('result-area').classList.add('hidden');
    document.getElementById('quiz-area').classList.remove('hidden');
    showQuestion();
  }

  function startTimer() {
    stopTimer();
    const wrapper = document.getElementById('timer-wrapper');
    const bar = document.getElementById('timer-bar');
    const textEl = document.getElementById('timer-text');
    const labelRow = document.getElementById('timer-label-row');

    if (timerLimitSeconds <= 0) {
      wrapper.classList.add('hidden');
      return;
    }

    wrapper.classList.remove('hidden');
    labelRow.classList.remove('warning');
    bar.classList.remove('half', 'danger');
    bar.style.transition = 'none';
    bar.style.width = '100%';
    textEl.textContent = `${timerLimitSeconds}秒`;

    void bar.offsetWidth;
    bar.style.transition = 'width 0.1s linear, background-color 0.3s ease';

    const totalMs = timerLimitSeconds * 1000;
    timerStartTime = Date.now();

    timerInterval = setInterval(() => {
      const elapsedMs = Date.now() - timerStartTime;
      const remainMs = Math.max(0, totalMs - elapsedMs);
      const ratio = (remainMs / totalMs) * 100;
      const remainSec = Math.ceil(remainMs / 1000);

      bar.style.width = `${ratio}%`;

      if (ratio <= 25 || remainSec <= 5) {
        bar.classList.remove('half');
        bar.classList.add('danger');
        labelRow.classList.add('warning');
      } else if (ratio <= 50) {
        bar.classList.add('half');
      }

      if (remainMs <= 0) {
        textEl.textContent = '0秒（時間切れ）';
        stopTimer();
      } else {
        textEl.textContent = `${remainSec}秒`;
      }
    }, 100);
  }

  function stopTimer() {
    if (timerInterval !== null) {
      clearInterval(timerInterval);
      timerInterval = null;
    }
  }

  function showQuestion() {
    const q = quizQuestions[currentIndex];
    const lv = q.mastery || 0;

    document.getElementById('progress-text').textContent = `問題 ${currentIndex + 1} / ${quizQuestions.length}（No.${q.num}）`;
    document.getElementById('question-category').textContent = q.category;

    const masteryPill = document.getElementById('question-mastery');
    masteryPill.textContent = MASTERY_LABELS[lv];
    masteryPill.className = `mastery-pill lv-${lv}`;

    document.getElementById('question-sentence').textContent = q.question;
    document.getElementById('explanation-area').classList.add('hidden');
    document.getElementById('next-btn').classList.add('hidden');

    const container = document.getElementById('choices-container');
    container.innerHTML = '';

    ['A', 'B', 'C', 'D'].forEach(key => {
      const choiceText = q.choices[key];
      if (!choiceText) return;

      const btn = document.createElement('button');
      btn.className = 'btn choice-btn';
      btn.dataset.choiceKey = key;
      btn.innerHTML = `<span class="choice-label">(${key})</span><span>${escapeHtml(choiceText)}</span>`;
      btn.onclick = () => checkAnswer(btn, key, q);
      container.appendChild(btn);
    });

    startTimer();
  }

  function getFormattedToday() {
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }

  function checkAnswer(selectedBtn, selectedKey, questionObj) {
    stopTimer();

    const correctKey = questionObj.answer;
    const buttons = document.querySelectorAll('.choice-btn');

    buttons.forEach(btn => {
      btn.disabled = true;
      if (btn.dataset.choiceKey === correctKey) {
        btn.classList.add('correct');
      }
    });

    const prevLv = questionObj.mastery || 0;
    let nextLv = prevLv;

    const banner = document.getElementById('result-banner');
    if (selectedKey === correctKey) {
      score++;
      banner.textContent = `⭕ 正解！（正解: ${correctKey}）`;
      banner.style.color = '#27ae60';

      // 正解時：未学習(0)→うろ覚え(2)、苦手(1)→うろ覚え(2)、うろ覚え(2)→ほぼ覚え(3)、ほぼ覚え(3)→完璧(4)
      if (prevLv === 0) {
        nextLv = 2;
      } else if (prevLv < 4) {
        nextLv = prevLv + 1;
      } else {
        nextLv = 4;
      }
    } else {
      selectedBtn.classList.add('wrong');
      banner.textContent = `❌ 不正解…（正解: ${correctKey}）`;
      banner.style.color = '#c0392b';

      // 不正解時：どの段階からでも苦手(1)に戻る
      nextLv = 1;
    }

    // 習得度と最終解答日を更新してlocalStorageに保存
    questionObj.mastery = nextLv;
    questionObj.lastAnswered = getFormattedToday();
    saveQuestionsToLocal();

    // 上部バッジとレベル変化表示を更新
    const masteryPill = document.getElementById('question-mastery');
    masteryPill.textContent = MASTERY_LABELS[nextLv];
    masteryPill.className = `mastery-pill lv-${nextLv}`;

    document.getElementById('level-change-text').textContent =
      `習得度: ${MASTERY_LABELS[prevLv]} → ${MASTERY_LABELS[nextLv]}`;

    const expText = questionObj.explanation || '（解説なし）';
    const transText = questionObj.translation || '（日本語訳なし）';
    document.getElementById('explanation-text').innerHTML = `<strong>【解説】</strong><br>${escapeHtml(expText).replace(/\n/g, '<br>')}`;
    document.getElementById('translation-text').innerHTML = `<strong>【日本語訳】</strong><br>${escapeHtml(transText).replace(/\n/g, '<br>')}`;
    document.getElementById('explanation-area').classList.remove('hidden');
    document.getElementById('next-btn').classList.remove('hidden');
  }

  function nextQuestion() {
    currentIndex++;
    if (currentIndex < quizQuestions.length) {
      showQuestion();
    } else {
      showResult();
    }
  }

  function showResult() {
    stopTimer();
    document.getElementById('quiz-area').classList.add('hidden');
    document.getElementById('result-area').classList.remove('hidden');
    document.getElementById('score-text').textContent = `${score} / ${quizQuestions.length} 問正解`;
  }

  function backToConfig() {
    stopTimer();
    renderMasterySummary();
    updateAvailableCount();
    document.getElementById('result-area').classList.add('hidden');
    document.getElementById('config-area').classList.remove('hidden');
  }

  // ① Excelファイルへの書き込み（ダウンロード出力）
  function exportToExcel() {
    if (!questionList || questionList.length === 0) {
      alert("出力するデータがありません。");
      return;
    }

    const meta = JSON.parse(localStorage.getItem(STORAGE_KEY_META) || '{}');
    const sheetName = meta.sheetName || '問題集';
    const baseName = meta.baseFileName || 'vocab_quiz';

    // ヘッダー行 + 全問題データ（A〜L列）を組み立てる
    const sheetData = [
      ['番号', '分野', '問題文', '選択肢A', '選択肢B', '選択肢C', '選択肢D', '解答', '解説', '日本語訳', '習得度', '最終解答日']
    ];

    questionList.forEach(q => {
      sheetData.push([
        q.num,
        q.category,
        q.question,
        q.choices.A,
        q.choices.B,
        q.choices.C,
        q.choices.D,
        q.answer,
        q.explanation,
        q.translation,
        MASTERY_LABELS[q.mastery || 0],
        q.lastAnswered || ''
      ]);
    });

    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.aoa_to_sheet(sheetData);
    XLSX.utils.book_append_sheet(wb, ws, sheetName);

    const todayStr = getFormattedToday().replace(/-/g, '');
    XLSX.writeFile(wb, `${baseName}_記録付_${todayStr}.xlsx`);
  }

  function escapeHtml(str) {
    return str.replace(/[&<>"']/g, match => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[match]));
  }
</script>
