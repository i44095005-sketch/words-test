<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>英単語小テスト</title>
  <!-- Excel読み込み用ライブラリ (SheetJS) -->
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 500px;
      margin: 0 auto;
      padding: 20px;
      background-color: #f4f7f6;
      color: #333;
    }
    .card {
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      margin-bottom: 20px;
    }
    h1 { font-size: 1.4rem; text-align: center; margin-top: 0; }
    input[type="file"] { width: 100%; margin: 10px 0; }
    .setting-group {
      margin: 15px 0;
      padding: 12px;
      background: #f8f9fa;
      border-radius: 8px;
    }
    .setting-group label {
      display: block;
      font-size: 0.9rem;
      font-weight: bold;
      margin-bottom: 8px;
    }
    .range-inputs {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    input[type="number"] {
      width: 80px;
      padding: 8px;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      text-align: center;
    }
    .word-display {
      font-size: 2rem;
      font-weight: bold;
      text-align: center;
      margin: 30px 0;
      color: #2c3e50;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      margin: 10px 0;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background-color: #3498db;
      color: white;
      transition: background 0.2s;
    }
    .btn:active { background-color: #2980b9; }
    .choice-btn {
      background-color: #ecf0f1;
      color: #2c3e50;
      text-align: left;
      font-weight: normal;
    }
    .choice-btn.correct { background-color: #2ecc71; color: white; }
    .choice-btn.wrong { background-color: #e74c3c; color: white; }
    .status { text-align: center; font-size: 0.9rem; color: #7f8c8d; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <!-- 1. ファイル選択画面 -->
  <div class="card" id="setup-area">
    <h1>英単語小テスト</h1>
    <p style="font-size: 0.9rem;">スマホ内のExcelファイル（.xlsx / .xls）を選択してください。（A列：英単語、B列：意味）</p>
    <input type="file" id="excel-file" accept=".xlsx, .xls, .csv">
  </div>

  <!-- 2. 出題範囲・出題数の設定画面 -->
  <div class="card hidden" id="config-area">
    <h1>出題設定</h1>
    <p class="status" id="total-words-info">全 0 単語を読み込みました</p>

    <div class="setting-group">
      <label>出題範囲（単語番号）</label>
      <div class="range-inputs">
        <input type="number" id="start-num" min="1" value="1"> 番目 〜
        <input type="number" id="end-num" min="1" value="10"> 番目
      </div>
    </div>

    <div class="setting-group">
      <label>出題数（ランダム出題）</label>
      <div class="range-inputs">
        <input type="number" id="question-count" min="1" value="10"> 問
      </div>
    </div>

    <button class="btn" onclick="startQuiz()">テスト開始</button>
    <button class="btn" style="background-color: #95a5a6;" onclick="location.reload()">別のファイルを選ぶ</button>
  </div>

  <!-- 3. クイズ画面 -->
  <div class="card hidden" id="quiz-area">
    <div class="status" id="progress-text">問題 1 / 10</div>
    <div class="word-display" id="question-word">apple</div>
    <div id="choices-container"></div>
    <button class="btn hidden" id="next-btn" onclick="nextQuestion()">次の問題へ</button>
  </div>

  <!-- 4. 結果画面 -->
  <div class="card hidden" id="result-area">
    <h1>テスト終了！</h1>
    <p class="word-display" id="score-text">8 / 10 問正解</p>
    <button class="btn" onclick="startQuiz()">同じ設定でもう一度</button>
    <button class="btn" style="background-color: #2ecc71;" onclick="backToConfig()">範囲・出題数を変更する</button>
    <button class="btn" style="background-color: #95a5a6;" onclick="location.reload()">別のファイルを選ぶ</button>
  </div>

<script>
  let wordList = [];
  let currentIndex = 0;
  let score = 0;
  let quizWords = [];

  // ファイル選択時の処理
  document.getElementById('excel-file').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
      const data = new Uint8Array(e.target.result);
      const workbook = XLSX.read(data, { type: 'array' });
      const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });

      // 1行目(ヘッダー)を除き、空行をフィルタリング
      wordList = rows.slice(1)
        .filter(row => row[0] && row[1])
        .map(row => ({ en: String(row[0]).trim(), ja: String(row[1]).trim() }));

      if (wordList.length < 4) {
        alert("4択問題を作るため、最低4単語以上登録されたExcelファイルを選んでください。");
        return;
      }

      // 設定画面の初期値をセット
      document.getElementById('total-words-info').textContent = `全 ${wordList.length} 単語を読み込みました`;
      document.getElementById('start-num').max = wordList.length;
      document.getElementById('end-num').max = wordList.length;
      document.getElementById('end-num').value = wordList.length;
      document.getElementById('question-count').value = Math.min(10, wordList.length);

      document.getElementById('setup-area').classList.add('hidden');
      document.getElementById('config-area').classList.remove('hidden');
    };
    reader.readAsArrayBuffer(file);
  });

  function startQuiz() {
    const startNum = parseInt(document.getElementById('start-num').value, 10);
    const endNum = parseInt(document.getElementById('end-num').value, 10);
    const count = parseInt(document.getElementById('question-count').value, 10);

    // 入力値のバリデーション
    if (isNaN(startNum) || isNaN(endNum) || startNum < 1 || endNum > wordList.length || startNum > endNum) {
      alert(`出題範囲は 1 〜 ${wordList.length} の間で正しく指定してください。`);
      return;
    }

    // 指定範囲の単語を抽出（配列は0始まりなので startNum - 1）
    const targetWords = wordList.slice(startNum - 1, endNum);

    if (isNaN(count) || count < 1) {
      alert("出題数は1以上を指定してください。");
      return;
    }

    // 範囲内の単語数より多い出題数が指定された場合は、範囲内の全単語数に合わせる
    const actualCount = Math.min(count, targetWords.length);

    // 範囲内の単語をシャッフルして指定数だけ切り出す
    quizWords = [...targetWords]
      .sort(() => Math.random() - 0.5)
      .slice(0, actualCount);

    currentIndex = 0;
    score = 0;
    document.getElementById('config-area').classList.add('hidden');
    document.getElementById('result-area').classList.add('hidden');
    document.getElementById('quiz-area').classList.remove('hidden');
    showQuestion();
  }

  function showQuestion() {
    const currentWord = quizWords[currentIndex];
    document.getElementById('progress-text').textContent = `問題 ${currentIndex + 1} / ${quizWords.length}`;
    document.getElementById('question-word').textContent = currentWord.en;
    document.getElementById('next-btn').classList.add('hidden');

    // 選択肢の作成（正解1つ + 全体の単語リストからランダム3つ）
    let choices = [currentWord.ja];
    let otherWords = wordList.filter(w => w.en !== currentWord.en);
    otherWords.sort(() => Math.random() - 0.5);
    for (let i = 0; i < 3; i++) {
      choices.push(otherWords[i].ja);
    }
    choices.sort(() => Math.random() - 0.5);

    const container = document.getElementById('choices-container');
    container.innerHTML = '';
    choices.forEach(choice => {
      const btn = document.createElement('button');
      btn.className = 'btn choice-btn';
      btn.textContent = choice;
      btn.onclick = () => checkAnswer(btn, choice, currentWord.ja);
      container.appendChild(btn);
    });
  }

  function checkAnswer(selectedBtn, selectedText, correctText) {
    const buttons = document.querySelectorAll('.choice-btn');
    buttons.forEach(btn => {
      btn.disabled = true;
      if (btn.textContent === correctText) {
        btn.classList.add('correct');
      }
    });

    if (selectedText === correctText) {
      score++;
    } else {
      selectedBtn.classList.add('wrong');
    }
    document.getElementById('next-btn').classList.remove('hidden');
  }

  function nextQuestion() {
    currentIndex++;
    if (currentIndex < quizWords.length) {
      showQuestion();
    } else {
      showResult();
    }
  }

  function showResult() {
    document.getElementById('quiz-area').classList.add('hidden');
    document.getElementById('result-area').classList.remove('hidden');
    document.getElementById('score-text').textContent = `${score} / ${quizWords.length} 問正解`;
  }

  function backToConfig() {
    document.getElementById('result-area').classList.add('hidden');
    document.getElementById('config-area').classList.remove('hidden');
  }
</script>
</body>
</html>
