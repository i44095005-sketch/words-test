<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>英単語小テスト</title>
  <!-- Excel読み込み用ライブラリ (SheetJS) -->
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 500px;
      margin: 0 auto;
      padding: 20px;
      background-color: #f4f7f6;
      color: #333;
    }
    .card {
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      margin-bottom: 20px;
    }
    h1 { font-size: 1.4rem; text-align: center; margin-top: 0; }
    input[type="file"] { width: 100%; margin: 10px 0; }
    .setting-group {
      margin: 15px 0;
      padding: 12px;
      background: #f8f9fa;
      border-radius: 8px;
    }
    .setting-group label {
      display: block;
      font-size: 0.9rem;
      font-weight: bold;
      margin-bottom: 8px;
    }
    .range-inputs {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    input[type="number"] {
      width: 80px;
      padding: 8px;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      text-align: center;
    }
    .word-display {
      font-size: 2rem;
      font-weight: bold;
      text-align: center;
      margin: 30px 0;
      color: #2c3e50;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      margin: 10px 0;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background-color: #3498db;
      color: white;
      transition: background 0.2s;
    }
    .btn:active { background-color: #2980b9; }
    .choice-btn {
      background-color: #ecf0f1;
      color: #2c3e50;
      text-align: left;
      font-weight: normal;
    }
    .choice-btn.correct { background-color: #2ecc71; color: white; }
    .choice-btn.wrong { background-color: #e74c3c; color: white; }
    .status { text-align: center; font-size: 0.9rem; color: #7f8c8d; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <!-- 1. ファイル選択画面 -->
  <div class="card" id="setup-area">
    <h1>英単語小テスト</h1>
    <p style="font-size: 0.9rem;">スマホ内のExcelファイル（.xlsx / .xls）を選択してください。（A列：英単語、B列：意味）</p>
    <input type="file" id="excel-file" accept=".xlsx, .xls, .csv">
  </div>

  <!-- 2. 出題範囲
